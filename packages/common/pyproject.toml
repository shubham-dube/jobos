[project]
name = "jobos-common"
version = "0.1.0"
description = "Shared models for JobOS: master profile, form schema, runner protocol"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobos_common"]
