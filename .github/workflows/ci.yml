name: CI
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobos, POSTGRES_PASSWORD: jobos, POSTGRES_DB: jobos_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobos" --health-interval 5s --health-retries 10
    env:
      JOBOS_TEST_DATABASE_URL: postgresql+psycopg://jobos:jobos@localhost:5432/jobos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.12" }
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - name: Tests (unit + e2e with fake ATS; LLM faked)
        run: |
          export JOBOS_TEST_CHROME=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
