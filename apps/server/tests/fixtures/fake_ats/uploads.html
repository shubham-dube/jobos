<!doctype html><html><body><form>
<!-- mirrors Greenhouse job-boards: the visible label carries the asterisk, the input's own label is a hidden "Attach" -->
<div class="field-wrapper"><div class="file-upload"><div class="label upload-label">Resume/CV<span class="required">*</span></div>
  <div class="button-container"><div><button type="button">Attach</button><label class="visually-hidden" for="resume">Attach</label>
  <input id="resume" class="visually-hidden" type="file" accept=".pdf"></div></div></div></div>
<div class="field-wrapper"><div class="file-upload"><div class="label upload-label">Cover Letter</div>
  <div class="button-container"><div><button type="button">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label>
  <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf"></div></div></div></div>
<div class="field-wrapper"><div class="file-upload"><div class="label upload-label">Please provide a recent transcript<span class="required">*</span></div>
  <div class="button-container"><div><button type="button">Attach</button><label class="visually-hidden" for="question_1">Attach</label>
  <input id="question_1" class="visually-hidden" type="file" accept=".pdf"></div></div></div></div>
<button type="submit">Submit application</button>
</form></body></html>
