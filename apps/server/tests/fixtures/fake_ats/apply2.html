<!doctype html><html><head><title>Apply - Step 2</title></head>
<body>
<form id="f2" onsubmit="event.preventDefault();
  if (!document.getElementById('transcript').files.length) {
    document.getElementById('transcript-error').textContent = 'This field is required.'; return; }
  sessionStorage.setItem('submitted','1'); location.href='thanks.html';">
  <!-- Greenhouse-style upload: asterisk on the visible label only, hidden "Attach" label, JS validation -->
  <div class="field-wrapper"><div class="file-upload"><div class="label upload-label">Please provide a recent transcript<span>*</span></div>
    <div><button type="button">Attach</button><label class="visually-hidden" for="transcript">Attach</label>
    <input id="transcript" class="visually-hidden" type="file" accept=".pdf"></div>
    <p id="transcript-error" class="error" role="alert"></p></div></div>
  <div class="field"><label for="gender">Gender (voluntary)</label>
    <select id="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
  <div class="field"><label for="hear">How did you hear about us?*</label>
    <select id="hear" required><option value="">Select...</option><option>LinkedIn</option><option>Company website</option><option>Referral</option></select></div>
  <div class="field"><label><input type="checkbox" id="consent" required> I agree to the privacy policy*</label></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
