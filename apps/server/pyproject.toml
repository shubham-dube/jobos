[project]
name = "jobos"
version = "0.1.0"
description = "JobOS control plane: API, durable workflows, agents"
requires-python = ">=3.12"
dependencies = [
  "jobos-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "dbos>=3.5",
  "pypdf>=5.1",
  "rapidfuzz>=3.10",
  "structlog>=24.4",
  "python-multipart>=0.0.18",
  "cryptography>=50.0.2",
  "typst>=0.13",
]

[project.scripts]
jobos = "jobos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobos"]
