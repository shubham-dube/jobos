[project]
name = "jobos-runner"
version = "0.1.0"
description = "JobOS local runner: drives a real Chrome profile on the user's computer"
requires-python = ">=3.12"
dependencies = [
  "jobos-common",
  "playwright>=1.49",
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.scripts]
jobos-runner = "jobos_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobos_runner"]
